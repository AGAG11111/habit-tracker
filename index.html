<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>מעקב הרגלים</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f6bed">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="הרגלים">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <h1>מעקב הרגלים</h1>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="החלף מצב כהה/בהיר">◐</button>
  </header>

  <main id="screen"></main>

  <nav class="tab-bar" aria-label="ניווט ראשי">
    <button class="tab" type="button" data-screen="today">היום</button>
    <button class="tab" type="button" data-screen="progress">התקדמות</button>
    <button class="tab" type="button" data-screen="habits">הרגלים</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
